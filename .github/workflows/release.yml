# RELEASE_VERSION を書き換えて main に押すと（または Actions の画面から実行すると）、
# dist/ の配布物と data/ の公開データを、その版のリリースとして GitHub に載せる。同じ版がすでにあれば何もしない。
name: release
on:
  push:
    branches: [main]
    paths: ['RELEASE_VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < RELEASE_VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG はすでにあります"; exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            dist/eval-method-atlas.mcpb dist/eval-method-atlas.mjs \
            data/atlas-data.json.gz data/questions.json \
            $(ls dist/papers.jsonl.gz 2>/dev/null) \
            --title "Eval Method Atlas $TAG" --notes-file RELEASE_NOTES.md
